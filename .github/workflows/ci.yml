name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: lint-and-build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check-types

      - name: Check for dynamically-constructed Tailwind classes
        run: pnpm run check-dynamic-classes

      - name: Check for orphaned docs pages
        run: pnpm exec turbo run check-orphaned-docs

      - name: Build
        run: pnpm exec turbo run build

      - name: Regression net (API surface / preflight reset / SSR smoke)
        run: pnpm exec turbo run check-regression-net
